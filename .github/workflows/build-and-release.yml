name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only on this repository; creating a release needs write access
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: DOM safety audit
        run: npm run audit:dom

      - name: Production Build
        run: npm run build

      - name: Package Chrome Web Store Zip
        run: python3 scripts/package.py

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "**Install SubShelf from the [Chrome Web Store](https://chromewebstore.google.com/detail/elmeglemgjhfadeahmlbcgkjkfkfkfgd).** It works in Chrome and Edge and updates automatically."
            echo
            awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md
            echo
            echo "The zip below is for developers and manual installs (Load unpacked in chrome://extensions). It does not update automatically."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: subshelf-v*.zip
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
